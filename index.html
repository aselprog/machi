<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Qduish Match Entry</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #0e0e0e;
      color: #ffffff;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 95%;
      max-width: 800px;
      background: #1e1e1e;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(255, 165, 0, 0.1);
      position: relative;
    }
    h2 {
      text-align: center;
      color: orange;
      margin-bottom: 30px;
    }
    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #ffb84d;
    }
    input, textarea, select {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: none;
      background-color: #2a2a2a;
      color: white;
      font-size: 14px;
    }
    textarea {
      resize: vertical;
    }
    .full-width {
      grid-column: 1 / -1;
    }
    button {
      grid-column: 1 / -1;
      padding: 12px;
      background-color: orange;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: darkorange;
    }
    .success, .error {
      grid-column: 1 / -1;
      margin-top: 15px;
      font-weight: bold;
      text-align: center;
    }
    .success { color: lightgreen; }
    .error { color: red; }

    .spinner {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 999;
    }
    .spinner div {
      width: 40px;
      height: 40px;
      border: 5px solid orange;
      border-top: 5px solid transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .disabled {
      pointer-events: none;
      opacity: 0.5;
    }

    @media(max-width: 600px) {
      form {
        grid-template-columns: 1fr;
      }
    }


      .kwenda{
        padding: 10px;
        background-color: red;
        border-radius: 5px;
        border: none;
      }
      .kwenda .futa{
        text-decoration: none;
        font-weight: bold;
        color: white;
        
      }
  </style>
</head>
<body>
  <div class="container">
    <button class="kwenda"> <a href="futa.html" class="futa">DELETE MATCH</a></button>
    <h2>Match Entry Form</h2>
    <form id="matchForm">
      <div>
        <label for="teamNames">Team Names:</label>
        <input type="text" id="teamNames" required>
      </div>

      <div>
        <label for="matchLink">Match Link:</label>
        <input type="url" id="matchLink" required>
      </div>

      <div class="full-width">
        <label for="teamLogos">Team Logos (Base64 or URL):</label>
        <textarea id="teamLogos" rows="3" required></textarea>
      </div>

      <div>
        <label for="leagueName">League Name:</label>
        <input type="text" id="leagueName" required>
      </div>

      <div>
        <label for="status">Status:</label>
        <select id="status" required>
          <option value="">-- Select --</option>
          <option value="Live">Live</option>
          <option value="Ended">Ended</option>
          <option value="custom">Set Time</option>
        </select>
      </div>

      <div id="dateTimeContainer" style="display: none;">
        <label for="matchDateTime">Select Date & Time:</label>
        <input type="datetime-local" id="matchDateTime">
      </div>

      <button type="submit">Submit</button>

      <div class="success" id="successMsg" style="display:none;">Successfully submitted!</div>
      <div class="error" id="errorMsg" style="display:none;">Something went wrong!</div>
    </form>
    <div class="spinner" id="spinner"><div></div></div>
  </div>

  <script>
    const form = document.getElementById("matchForm");
    const spinner = document.getElementById("spinner");
    const successMsg = document.getElementById("successMsg");
    const errorMsg = document.getElementById("errorMsg");
    const statusSelect = document.getElementById("status");
    const dateTimeContainer = document.getElementById("dateTimeContainer");
    const matchDateTime = document.getElementById("matchDateTime");

    statusSelect.addEventListener("change", () => {
      if (statusSelect.value === "custom") {
        dateTimeContainer.style.display = "block";
        matchDateTime.required = true;
      } else {
        dateTimeContainer.style.display = "none";
        matchDateTime.required = false;
      }
    });

    function formatDateStatus(dateInput) {
      if (!dateInput) return "";
      const inputDate = new Date(dateInput);
      const now = new Date();

      const inputDateOnly = new Date(inputDate.getFullYear(), inputDate.getMonth(), inputDate.getDate());
      const nowDateOnly = new Date(now.getFullYear(), now.getMonth(), now.getDate());

      const diff = (inputDateOnly - nowDateOnly) / (1000 * 60 * 60 * 24);
      const time = inputDate.toTimeString().slice(0,5); // hh:mm

      if (diff === 0) return `Today ${time}`;
      if (diff === 1) return `Tomorrow ${time}`;
      return `${inputDate.toISOString().slice(0, 10)} ${time}`;
    }

    form.addEventListener("submit", function(e) {
      e.preventDefault();

      spinner.style.display = "block";
      form.classList.add("disabled");

      let statusValue = statusSelect.value;
      if (statusValue === "custom") {
        statusValue = formatDateStatus(matchDateTime.value);
      }

      const data = {
        teamNames: document.getElementById("teamNames").value,
        teamLogos: document.getElementById("teamLogos").value,
        matchLink: document.getElementById("matchLink").value,
        leagueName: document.getElementById("leagueName").value,
        status: statusValue
      };

      fetch("https://script.google.com/macros/s/AKfycbw7-h7K6iHAm8VTaXhffzenON01UQw5neYVY0PLXOQNgzNZRbNAXf1n9NiFLJ1ovXeD4w/exec", {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      }).then(() => {
        successMsg.style.display = "block";
        errorMsg.style.display = "none";
        form.reset();
        dateTimeContainer.style.display = "none";
      }).catch(() => {
        errorMsg.style.display = "block";
        successMsg.style.display = "none";
      }).finally(() => {
        spinner.style.display = "none";
        form.classList.remove("disabled");
      });
    });
  </script>
</body>
</html>
