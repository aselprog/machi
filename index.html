<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Team Manager</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      margin: 0;
      padding: 20px;
    }
    .tab { display: none; }
    .tab.active { display: block; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
    }
    th {
      background: #4CAF50;
      color: #fff;
    }
    button {
      padding: 6px 10px;
      margin: 2px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
    }
    .btn-edit { background: #2196F3; color: white; }
    .btn-delete { background: #f44336; color: white; }
    .btn-save { background: #4CAF50; color: white; }
    .btn-cancel { background: #9e9e9e; color: white; }
    .spinner {
      border: 2px solid #f3f3f3;
      border-top: 2px solid #333;
      border-radius: 50%;
      width: 14px;
      height: 14px;
      animation: spin 1s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-left: 6px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      box-sizing: border-box;
    }
    .message {
      margin-top: 15px;
      padding: 10px;
      background: #dff0d8;
      color: #3c763d;
      display: none;
    }
    .message.error {
      background: #f2dede;
      color: #a94442;
    }
    
          .kwenda{
        padding: 10px;
        background-color: blue;
        border-radius: 5px;
        border: none;
      }
      .kwenda .futa{
        text-decoration: none;
        font-weight: bold;
        color: white;
        
      }
  </style>
</head>
<body>

  <div id="view-tab" class="tab active">
    <h2>Teams List</h2>
    <button class="kwenda"> <a href="add.html" class="futa">ADD MATCH</a></button>
    <table>
      <thead>
        <tr>
          <th>Actions</th>
          <th>Team Name</th>
          <th>Team Logo</th>
          <th>League Name</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <div id="edit-tab" class="tab">
    <h2>Edit Team</h2>
    <input type="text" id="team-name" placeholder="Team Name">
    <input type="text" id="team-logo" placeholder="Team Logo URL">
    <input type="text" id="match-link" placeholder="Match Link" style="max-width:400px">
    <input type="text" id="league-name" placeholder="League Name">
    <input type="text" id="status" placeholder="Status">
    <button class="btn-save" id="save-btn" onclick="saveData()">Save</button>
    <button class="btn-cancel" onclick="cancelEdit()">Cancel</button>
    <div class="message" id="message"></div>
  </div>

  <script>
    const SHEET_API = "https://sheets.googleapis.com/v4/spreadsheets/1GjZiv_kDhWBdVbncgxKBm7G13k3P41l48ij0qs5V350/values/Sheet1?key=AIzaSyDIw6pHVQwrpv1TjkcNsxU1K8ulixnD5QM";
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxONoDtqsUSWuVTksIdu5BLZyFQbOeIt2fZKiWdiURIMza8m9psyFhGvhv3rzrK3UX0Sg/exec";

    let currentIndex = null;

    function loadTable() {
      fetch(SHEET_API)
        .then(res => res.json())
        .then(data => {
          const rows = data.values.slice(1);
          let html = '';
          rows.forEach((row, i) => {
            html += `
              <tr>
                <td>
                  <button class="btn-edit" onclick='editRow(${i})'>Edit</button>
                  <button class="btn-delete" onclick='deleteRow(this, ${i})'>Delete</button>
                </td>
                <td>${row[0]}</td>
                <td><img src="${row[1]}" width="50"></td>
                <td>${row[3]}</td>
                <td>${row[4]}</td>
              </tr>`;
          });
          document.getElementById("table-body").innerHTML = html;
        })
        .catch(err => showMessage("Failed to load data: " + err.message, true));
    }

    function editRow(index) {
      fetch(SHEET_API)
        .then(res => res.json())
        .then(data => {
          const row = data.values[index + 1];
          currentIndex = index;
          document.getElementById("team-name").value = row[0];
          document.getElementById("team-logo").value = row[1];
          document.getElementById("match-link").value = row[2];
          document.getElementById("league-name").value = row[3];
          document.getElementById("status").value = row[4];
          showTab("edit-tab");
        })
        .catch(err => showMessage("Error loading row: " + err.message, true));
    }

    function deleteRow(btn, index) {
      const originalText = btn.innerHTML;
      btn.innerHTML = 'Deleting <span class="spinner"></span>';
      btn.disabled = true;

      fetch(`${SCRIPT_URL}?action=delete&index=${index}`)
        .then(res => res.json())
        .then(() => {
          showMessage("Row deleted successfully!");
          loadTable();
        })
        .catch(err => showMessage("Delete failed: " + err.message, true))
        .finally(() => {
          btn.innerHTML = originalText;
          btn.disabled = false;
        });
    }

    function saveData() {
      const saveBtn = document.getElementById("save-btn");
      const originalText = saveBtn.innerHTML;
      saveBtn.innerHTML = 'Saving <span class="spinner"></span>';
      saveBtn.disabled = true;

      if (currentIndex === null) {
        showMessage("No row selected to edit.", true);
        saveBtn.innerHTML = originalText;
        saveBtn.disabled = false;
        return;
      }

      const teamName = document.getElementById("team-name").value;
      const teamLogo = document.getElementById("team-logo").value;
      const matchLink = document.getElementById("match-link").value;
      const leagueName = document.getElementById("league-name").value;
      const status = document.getElementById("status").value;

      const url = `${SCRIPT_URL}?action=edit&index=${currentIndex}&teamName=${encodeURIComponent(teamName)}&teamLogo=${encodeURIComponent(teamLogo)}&matchLink=${encodeURIComponent(matchLink)}&leagueName=${encodeURIComponent(leagueName)}&status=${encodeURIComponent(status)}`;

      fetch(url)
        .then(res => {
          if (!res.ok) throw new Error("Network response was not ok");
          return res.json();
        })
        .then(() => {
          showMessage("Changes saved successfully!");
          showTab("view-tab");
          loadTable();
        })
        .catch(err => showMessage("Save failed: " + err.message, true))
        .finally(() => {
          saveBtn.innerHTML = originalText;
          saveBtn.disabled = false;
        });
    }

    function cancelEdit() {
      showTab("view-tab");
    }

    function showTab(tabId) {
      document.querySelectorAll(".tab").forEach(tab => tab.classList.remove("active"));
      document.getElementById(tabId).classList.add("active");
    }

    function showMessage(msg, isError = false) {
      const box = document.getElementById("message");
      box.textContent = msg;
      box.classList.toggle("error", isError);
      box.style.display = "block";
      setTimeout(() => box.style.display = "none", 4000);
    }

    window.onload = loadTable;
  </script>

</body>
</html>
